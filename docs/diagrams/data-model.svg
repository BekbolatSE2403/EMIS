<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111827} .t{font-size:25px;font-weight:bold} .b{font-size:19px} .n{font-size:17px}</style><text class="t" x="35" y="42">EMIS logical data relationships</text><text class="n" x="35" y="73">Selected target design · 2 November 2026 · Backend and hardware proof pending</text><path d="M285 200 L410 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text class="n" text-anchor="middle" x="347.5" y="191.0">1 : 1</text><path d="M690 200 L810 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text class="n" text-anchor="middle" x="750.0" y="191.0">1 : many</text><path d="M550 250 L550 360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text class="n" text-anchor="middle" x="550.0" y="296.0">1 : many</text><path d="M160 250 L160 360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text class="n" text-anchor="middle" x="160.0" y="296.0">1 : many</text><path d="M690 230 L810 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text class="n" text-anchor="middle" x="750.0" y="301.0">nullable refs</text><rect x="35" y="150" width="250" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text class="b" style="font-size:19.0px" x="49" y="179">users</text><text class="b" style="font-size:19.0px" x="49" y="204">UUID and credentials</text><text class="b" style="font-size:19.0px" x="49" y="229">Account status</text><rect x="410" y="150" width="280" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text class="b" style="font-size:19.0px" x="424" y="179">medical_profiles</text><text class="b" style="font-