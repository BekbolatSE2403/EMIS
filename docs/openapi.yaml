openapi: 3.1.0
info:
  title: EMIS target API contract
  version: 0.2.0
  description: >-
    Design baseline dated 2 November 2026. Not implemented. Report Sections 6 and 7, decisions.md
    and api-contract.md define semantics. All examples/data must be fictional.
servers:
  - url: /api
    description: Same-origin target reverse proxy; not a deployed service.
paths:
  /public/profiles/{publicId}:
    get:
      operationId: get_public_profiles_publicId
      summary: Read current owner-approved public summary.
      description: Target design only; not implemented.
      security: []
      responses:
        '200':
          description: Read current owner-approved public summary.
          headers:
            Cache-Control:
              description: All health/auth/identifier responses must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          description: Resource unavailable; public failures never reveal a private profile.
          headers:
            Cache-Control:
              description: All health/auth/identifier responses must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PROFILE_UNAVAILABLE
                message: Emergency information unavailable.
        '429':
          description: Generic throttling response.
          headers:
            Cache-Control:
              description: All health/auth/identifier responses must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable without medical fallback.
          headers:
            Cache-Control:
              description: All health/auth/identifier responses must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          description: Raw 43-character random link value; never a user/profile database ID.
