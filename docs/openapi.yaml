components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-EMISSESSION
      description: Server-managed session; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Synchronizer token obtained from /auth/csrf; required for every unsafe request.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - code
        - message
    Accepted:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - accepted
      required:
        - status
    Csrf:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        headerName:
          type: string
          const: X-CSRF-TOKEN
      required:
        - token
        - headerName
    Credentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 15
          maxLength: 128
      required:
        - email
        - password
    EmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email
    Verification:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - token
    RecoveryComplete:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
      required:
        - token
        - newPassword
    MedicalEntryWrite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - label
    MedicalEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 200
        isPublic:
          type: boolean
      required:
        - id
        - label
        - isPublic
    ContactWrite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type:
            - string
            - 'null'
          maxLength: 80
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
        sharingPermissionConfirmed:
          type: boolean
      required:
        - name
        - relationship
        - phone
        - sharingPermissionConfirmed
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type:
            - string
            - 'null'
          maxLength: 80
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
        isPublic:
          type: boolean
        sharingPermissionConfirmed:
          type: boolean
      required:
        - id
        - name
        - relationship
        - phone
        - isPublic
        - sharingPermissionConfirmed
    PublicContact:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
