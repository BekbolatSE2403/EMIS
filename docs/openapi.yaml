            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
        conditions:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
        medications:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
        emergencyContacts:
